name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Um push novo na mesma branch cancela a execução anterior, que já ficou velha
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API · testes
    runs-on: ubuntu-latest
    steps:
      - name: Baixa o código
        uses: actions/checkout@v7

      # O modelo tem 328 MB no Git LFS e a cota de download do LFS é limitada.
      # Com o cache, o download só acontece quando o modelo muda.
      - name: Lista os arquivos do Git LFS
        run: git lfs ls-files --long | cut -d ' ' -f1 | sort > .lfs-ids

      - name: Restaura o modelo do cache
        uses: actions/cache@v6
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-ids') }}

      - name: Baixa o modelo
        run: git lfs pull

      - name: Instala o Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt

      # Mesmo índice de CPU do Dockerfile, para não baixar o torch com CUDA.
      # Do requirements-dev só entra o pytest; o resto é ferramenta de treino.
      - name: Instala as dependências
        run: |
          pip install \
            --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple \
            -r requirements.txt \
            $(grep '^pytest==' requirements-dev.txt)

      - name: Roda os testes
        run: pytest -v

  web:
    name: Interface · lint e build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Baixa o código
        uses: actions/checkout@v7

      - name: Instala o Node
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instala as dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
